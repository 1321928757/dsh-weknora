# The configuration layer this bundle contributes when a profile lists it.
#
# This is only the bootstrap layer: every field here is what a fresh install can
# read from the environment. Everything else — timeouts, tool switches, the API
# key — is edited on 设置 → WeKnora 知识库, whose user overrides take precedence
# over these values.
#
# The API key is deliberately absent: with this version it lives in the local
# credential file ($DSH_HOME/storages/dsh-weknora/credentials.json), never in a
# config row that gets dumped, backed up and echoed back to the client.
- insert:
    - id: weknora
      # Must be the published package name — the loader imports this specifier.
      # Quoted because YAML reserves a leading '@' in plain scalars.
      name: "@wxg-prc-cpg/dsh-weknora"
      config:
        baseUrl: !!js process.env.WEKNORA_BASE_URL ?? 'http://localhost:8080/api/v1'
        toolPrefix: !!js process.env.WEKNORA_TOOL_PREFIX || 'weknora'
